[workspace]
resolver = "2"
members = ["crates/relay-cache"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ekscrypto/bitcraft-relay"

[workspace.dependencies]
# Shared relay crates live in the generic spacetimedb-relay repo.
#
# Production form (once the relay-core-v2.2.0 tag is pushed to GitHub):
#   relay-protocol    = { git = "https://github.com/ekscrypto/spacetimedb-relay.git", tag = "relay-core-v2.2.0" }
#   relay-coordinator = { git = "https://github.com/ekscrypto/spacetimedb-relay.git", tag = "relay-core-v2.2.0" }
#
# Local form for in-place development alongside a checkout of the
# generic repo (this is what's active now):
relay-protocol = { path = "../spacetimedb-relay/crates/relay-protocol" }
relay-coordinator = { path = "../spacetimedb-relay/crates/relay-coordinator" }

# External deps — versions MUST match the generic repo's
# [workspace.dependencies] so the BSATN / SpacetimeDB wire-format
# versions line up end-to-end.
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustls = { version = "0.23", features = ["ring"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"
http = "1"
url = "2"

axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

anyhow = "1"
thiserror = "2"

clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
hashbrown = "0.14"
parking_lot = "0.12"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# SpacetimeDB internal crates — versions MUST match the generic repo.
spacetimedb-sats = "2.2"
spacetimedb-client-api-messages = "2.2"
spacetimedb-lib = "2.2"
spacetimedb-sql-parser = "2.2"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

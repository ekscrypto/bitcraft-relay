<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Region map viewer — relay.bitcraftsync.app</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --muted: #8b949e;
  --link: #79c0ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
#stage { position: fixed; inset: 0; overflow: hidden; cursor: grab; background: #183e66; touch-action: none; }
#stage.panning { cursor: grabbing; }
/* Everything visible lives in #layer, laid out in screen px for the last
   committed view. Gestures only move #layer with a GPU transform; the visible
   tiles/chunks are re-picked and re-laid-out once the gesture pauses. */
#layer { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; pointer-events: none; }
#layer > * { position: absolute; left: 0; top: 0; }
/* Explicit stacking: #raster's per-level z-index must stay inside #raster. */
#preview { z-index: 0; }
#raster { z-index: 1; }
#vector { z-index: 2; }
#watch { z-index: 3; }
#grid { z-index: 4; }
#labels { z-index: 5; }
#mines { z-index: 6; }
#raster img, #vector img, #preview { position: absolute; display: block; max-width: none; user-select: none; -webkit-user-drag: none; }
#raster img { image-rendering: auto; }
#labels { width: 100%; height: 100%; overflow: visible; }
.hud {
  position: fixed; z-index: 10; display: flex; gap: 8px; align-items: center;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
}
#topbar { top: 12px; left: 12px; flex-wrap: wrap; max-width: calc(100vw - 24px); }
#zoombar { bottom: 12px; right: 12px; }
.hud a { color: var(--link); text-decoration: none; }
.hud a:hover { text-decoration: underline; }
.hud button {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 10px; font-size: 14px; cursor: pointer;
}
.hud button:hover { border-color: var(--link); color: var(--link); }
.hud select {
  background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 6px; font-size: 14px;
}
.hud label { display: flex; gap: 5px; align-items: center; cursor: pointer; user-select: none; }
.hud label.disabled { color: var(--muted); cursor: not-allowed; }
#wtstatus { color: var(--muted); font-size: 13px; }
#wtstatus:empty { display: none; }
#minesstatus { color: var(--muted); font-size: 13px; }
#minesstatus:empty { display: none; }
#zoomlabel { min-width: 52px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
#download[hidden] { display: none; }
#coordtip {
  position: fixed; z-index: 15; display: none; pointer-events: none;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px;
  font-size: 13px; font-variant-numeric: tabular-nums; white-space: pre;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
}
#loading {
  position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--bg) 75%, transparent); color: var(--muted); font-size: 15px;
}
#loading[hidden] { display: none; }
#error { color: #f85149; }
</style>
</head>
<body>
<div id="stage">
  <div id="layer">
    <div id="raster"></div>
    <div id="vector"></div>
    <canvas id="watch"></canvas>
    <canvas id="grid"></canvas>
    <svg id="labels" xmlns="http://www.w3.org/2000/svg"></svg>
    <canvas id="mines"></canvas>
  </div>
</div>

<div class="hud" id="topbar">
  <a href="index.html">&larr; Region maps</a>
  <select id="region"></select>
  <span id="zoomlabel"></span>
  <a id="download" hidden download>SVG &darr;</a>
  <label id="wtlabel" title="Empire watchtowers and the chunks each one covers"><input type="checkbox" id="wt"> Watchtowers</label>
  <span id="wtstatus"></span>
  <label id="mineslabel" title="Mining caves, marked by ore tier (T1 Ferralith … T10 Astralite)"><input type="checkbox" id="minesbox"> Mine tiers</label>
  <span id="minesstatus"></span>
</div>

<div class="hud" id="zoombar">
  <button id="zoom-out" title="Zoom out (or mouse wheel / - key)">&minus;</button>
  <button id="zoom-in" title="Zoom in (or mouse wheel / + key)">+</button>
  <button id="fit" title="Fit whole region (or 0 key)">Fit</button>
</div>

<div id="coordtip"></div>

<div id="loading"><span id="loadingtext">Loading&hellip;</span><span id="error" hidden></span></div>

<script>
(function () {
  "use strict";
  var REGIONS = ["7", "8", "9", "12", "13", "14", "17", "18", "19"];
  var MAX_DEPTH = 60;            // deepest zoom: fit-width / MAX_DEPTH
  var REGION_SIDE = 7680;        // small-hex tiles per region side (odd-r lattice)
  var SUPER_SIDE = 2560;         // super-hex (terrain cell) grid per region side
  var SQRT3 = Math.sqrt(3);
  var SVGNS = "http://www.w3.org/2000/svg";

  // Rendering budget knobs.
  var COMMIT_DELAY = 160;        // ms of gesture inactivity before re-picking tiles
  var GRID_MIN_PX = 3;           // hex grid hidden while small hexes are narrower than this
  var VECTOR_MIN_SCALE = 1.25;   // device px per canvas px above which vector chunks draw
  var VECTOR_MAX_CHUNKS = 64;    // never draw more chunks than this at once
  var BASE_LEVEL_DROP = 3;       // coarse fallback level under the sharp one (no flash while loading)

  var stage = document.getElementById("stage");
  var layer = document.getElementById("layer");
  var rasterEl = document.getElementById("raster");
  var vectorEl = document.getElementById("vector");
  var gridCanvas = document.getElementById("grid");
  var labelsSvg = document.getElementById("labels");
  var loading = document.getElementById("loading");
  var loadingText = document.getElementById("loadingtext");
  var errorEl = document.getElementById("error");
  var zoomLabel = document.getElementById("zoomlabel");
  var downloadEl = document.getElementById("download");
  var select = document.getElementById("region");

  var man = null;                // manifest.json
  var base = null;               // {x,y,w,h} fit view (whole canvas)
  var view = null;               // current {x,y,w,h} in canvas units
  var committed = null;          // view currently laid out in #layer
  var proj = null;               // {size,xOff,yOff} — mapgen Projection params
  var tiles = new Map();         // key → <img> currently in #raster
  var chunks = new Map();        // key → <img> currently in #vector
  var preview = null;            // low-res whole-region image until tiles arrive
  var rafId = 0, commitTimer = 0;

  var params = new URLSearchParams(location.search);
  var wtOn = params.get("watchtowers") === "1";
  var minesOn = params.get("mines") === "1";
  var region = REGIONS.indexOf(String(params.get("region") || "")) >= 0 ? params.get("region") : REGIONS[0];

  REGIONS.forEach(function (r) {
    var o = document.createElement("option");
    o.value = r; o.textContent = "Region " + r;
    if (r === region) o.selected = true;
    select.appendChild(o);
  });
  select.addEventListener("change", function () {
    location.search = "?region=" + select.value + (wtOn ? "&watchtowers=1" : "") + (minesOn ? "&mines=1" : "");
  });

  function dir() { return "region-" + region + "/"; }
  function bust(url) { return url + "?v=" + encodeURIComponent(man.version); }

  // --- view math ------------------------------------------------------------

  // meet-fit scale + letterbox offsets for a view in the current stage
  function layout(v) {
    var rect = stage.getBoundingClientRect();
    var s = Math.min(rect.width / v.w, rect.height / v.h);
    return { s: s, ox: (rect.width - v.w * s) / 2, oy: (rect.height - v.h * s) / 2, sw: rect.width, sh: rect.height };
  }

  // map a screen point (relative to stage) to canvas coords
  function toWorld(px, py) {
    var L = layout(view);
    return { x: view.x + (px - L.ox) / L.s, y: view.y + (py - L.oy) / L.s, s: L.s };
  }

  // --- gesture preview (compositor-only) --------------------------------------

  function render() {
    rafId = 0;
    if (!view || !committed) return;
    var c = layout(committed), v = layout(view), k = v.s / c.s;
    var tx = v.ox + (committed.x - view.x) * v.s - c.ox * k;
    var ty = v.oy + (committed.y - view.y) * v.s - c.oy * k;
    layer.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + k + ")";
  }

  // --- commit: pick + lay out what is visible --------------------------------

  function place(el, L, x, y, w, h) {
    // Round both edges (not origin + size) so neighbouring tiles share a pixel
    // boundary exactly — no hairline seams.
    var l = Math.round(L.ox + (x - view.x) * L.s), t = Math.round(L.oy + (y - view.y) * L.s);
    var r = Math.round(L.ox + (x + w - view.x) * L.s), b = Math.round(L.oy + (y + h - view.y) * L.s);
    el.style.left = l + "px"; el.style.top = t + "px";
    el.style.width = (r - l) + "px"; el.style.height = (b - t) + "px";
  }

  // visible canvas rect (whole stage, letterbox included), with a margin
  function visibleRect(L, marginPx) {
    var m = (marginPx || 0) / L.s;
    return {
      x0: view.x - L.ox / L.s - m, y0: view.y - L.oy / L.s - m,
      x1: view.x + (L.sw - L.ox) / L.s + m, y1: view.y + (L.sh - L.oy) / L.s + m
    };
  }

  function sync(map, parent, want) {
    map.forEach(function (el, key) {
      if (!want.has(key)) { el.remove(); map.delete(key); }
    });
  }

  function addTiles(L, vis, z, want, zIndex) {
    var k = Math.pow(2, z - man.maxZoom);
    var T = man.tileSize / k;                    // canvas units per tile
    var nx = Math.ceil(man.width * k / man.tileSize), ny = Math.ceil(man.height * k / man.tileSize);
    var ix0 = Math.max(0, Math.floor(vis.x0 / T)), ix1 = Math.min(nx - 1, Math.floor(vis.x1 / T));
    var iy0 = Math.max(0, Math.floor(vis.y0 / T)), iy1 = Math.min(ny - 1, Math.floor(vis.y1 / T));
    for (var iy = iy0; iy <= iy1; iy++) {
      for (var ix = ix0; ix <= ix1; ix++) {
        var key = z + "/" + ix + "_" + iy;
        want.add(key);
        var img = tiles.get(key);
        if (!img) {
          img = new Image();
          img.alt = "";
          img.decoding = "async";
          img.draggable = false;
          img.src = bust(dir() + "tiles/" + key + ".png");
          tiles.set(key, img);
          rasterEl.appendChild(img);
        }
        img.style.zIndex = zIndex;
        place(img, L, ix * T, iy * T, T, T);
      }
    }
  }

  function layoutRaster(L, vis) {
    var dpr = window.devicePixelRatio || 1;
    // Sharpest level we need: tile px per canvas unit ≥ device px per canvas unit.
    var z = Math.ceil(man.maxZoom + Math.log2(L.s * dpr));
    z = Math.max(0, Math.min(man.maxZoom, z));
    var zb = Math.max(0, z - BASE_LEVEL_DROP);
    var want = new Set();
    if (zb !== z) addTiles(L, vis, zb, want, 0);
    addTiles(L, vis, z, want, 1);
    sync(tiles, rasterEl, want);
  }

  function layoutVector(L, vis) {
    var dpr = window.devicePixelRatio || 1;
    var want = new Set();
    if (L.s * dpr >= VECTOR_MIN_SCALE) {
      var hits = [];
      for (var i = 0; i < man.chunks.length; i++) {
        var c = man.chunks[i];   // [cx, cz, x, y, w, h]
        if (c[2] + c[4] < vis.x0 || c[2] > vis.x1 || c[3] + c[5] < vis.y0 || c[3] > vis.y1) continue;
        hits.push(c);
      }
      if (hits.length <= VECTOR_MAX_CHUNKS) {
        hits.forEach(function (c) {
          var key = c[0] + "_" + c[1];
          want.add(key);
          var img = chunks.get(key);
          if (!img) {
            img = new Image();
            img.alt = "";
            img.decoding = "async";
            img.draggable = false;
            img.src = bust(dir() + "vec/" + key + ".svg");
            chunks.set(key, img);
            vectorEl.appendChild(img);
          }
          place(img, L, c[2], c[3], c[4], c[5]);
        });
      }
    }
    sync(chunks, vectorEl, want);
  }

  // Super-hex outline lattice (the full SVG's hexgrid pattern), only for the
  // visible area: each hex strokes 3 of its 6 edges, which covers every edge
  // of the tiling exactly once.
  function drawGrid(L, vis) {
    var dpr = window.devicePixelRatio || 1;
    var cw = Math.round(L.sw * dpr), ch = Math.round(L.sh * dpr);
    if (gridCanvas.width !== cw || gridCanvas.height !== ch) {
      gridCanvas.width = cw; gridCanvas.height = ch;
      gridCanvas.style.width = L.sw + "px"; gridCanvas.style.height = L.sh + "px";
    }
    var g = gridCanvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cw, ch);
    if (SQRT3 * proj.size * L.s < GRID_MIN_PX) return;
    var R = proj.size * 3;                      // super-hex radius, canvas units
    var a = pixelToTile(vis.x0, vis.y1, 3), b = pixelToTile(vis.x1, vis.y0, 3);
    var sz0 = Math.min(a.z, b.z) - 1, sz1 = Math.max(a.z, b.z) + 1;
    var sx0 = Math.min(a.x, b.x) - 1, sx1 = Math.max(a.x, b.x) + 1;
    var k = L.s * dpr;
    g.setTransform(k, 0, 0, k, (L.ox - view.x * L.s) * dpr, (L.oy - view.y * L.s) * dpr);
    g.lineWidth = 0.48;
    g.strokeStyle = "rgba(16,20,24," + (0.85 * 0.32) + ")";
    // corner offsets for corners at -30°, 30°, 90°, 150° (edges 0..2)
    var dx = [], dy = [];
    [-30, 30, 90, 150].forEach(function (deg) {
      var t = deg * Math.PI / 180;
      dx.push(R * Math.cos(t)); dy.push(R * Math.sin(t));
    });
    g.beginPath();
    for (var sz = sz0; sz <= sz1; sz++) {
      var shift = SQRT3 * R * ((sz & 1) ? 0.5 : 0);
      var cy = proj.yOff - 1.5 * R * sz;
      for (var sx = sx0; sx <= sx1; sx++) {
        // odd-r offset → axial → canvas center (+z north is up)
        var cx = proj.xOff + SQRT3 * R * sx + shift;
        g.moveTo(cx + dx[0], cy + dy[0]);
        g.lineTo(cx + dx[1], cy + dy[1]);
        g.lineTo(cx + dx[2], cy + dy[2]);
        g.lineTo(cx + dx[3], cy + dy[3]);
      }
    }
    g.stroke();
  }

  function buildLabels() {
    labelsSvg.textContent = "";
    var frag = document.createDocumentFragment();
    (man.labels || []).forEach(function (l) {
      // [anchorX, baselineY, plateX, plateY, plateW, plateH, fontPx, text]
      var rect = document.createElementNS(SVGNS, "rect");
      rect.setAttribute("x", l[2]); rect.setAttribute("y", l[3]);
      rect.setAttribute("width", l[4]); rect.setAttribute("height", l[5]);
      rect.setAttribute("rx", Math.max(2, l[6] * 0.3));
      rect.setAttribute("fill", "#101418"); rect.setAttribute("fill-opacity", "0.55");
      var text = document.createElementNS(SVGNS, "text");
      text.setAttribute("x", l[0]); text.setAttribute("y", l[1]);
      text.setAttribute("font-family", "DejaVu Sans, Verdana, sans-serif");
      text.setAttribute("font-size", l[6]);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", "#ffffff");
      text.setAttribute("stroke", "#101418");
      text.setAttribute("stroke-width", Math.max(1.5, l[6] / 8));
      text.setAttribute("stroke-linejoin", "round");
      text.setAttribute("paint-order", "stroke");
      text.textContent = l[7];
      frag.appendChild(rect); frag.appendChild(text);
    });
    labelsSvg.appendChild(frag);
  }

  function commit() {
    clearTimeout(commitTimer); commitTimer = 0;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (!man || !view) return;
    committed = { x: view.x, y: view.y, w: view.w, h: view.h };
    var L = layout(view);
    var vis = visibleRect(L, 0);
    layoutRaster(L, visibleRect(L, 64));
    layoutVector(L, visibleRect(L, 32));
    drawGrid(L, vis);
    drawWatch();
    drawMines();
    labelsSvg.setAttribute("viewBox", view.x + " " + view.y + " " + view.w + " " + view.h);
    labelsSvg.style.width = L.sw + "px"; labelsSvg.style.height = L.sh + "px";
    if (preview) {
      // Only while zoomed out: an <img> blown up to tens of thousands of px
      // is itself slow in some browsers, and the coarse tile level covers it.
      var showPreview = man.width * L.s <= 8192;
      preview.style.display = showPreview ? "" : "none";
      if (showPreview) place(preview, L, 0, 0, man.width, man.height);
    }
    layer.style.transform = "";
  }

  function apply(immediate) {
    if (!man || !view) return;
    var depth = base.w / view.w;   // 1 = fit, MAX_DEPTH = deepest
    zoomLabel.textContent = Math.round(depth * 100) + "%";
    document.getElementById("zoom-in").disabled = depth >= MAX_DEPTH - 0.01;
    document.getElementById("zoom-out").disabled = depth <= 1.0001;
    if (immediate || !committed) { commit(); return; }
    if (!rafId) rafId = requestAnimationFrame(render);
    clearTimeout(commitTimer);
    commitTimer = setTimeout(commit, COMMIT_DELAY);
  }

  function fit() {
    if (!base) return;
    view = { x: base.x, y: base.y, w: base.w, h: base.h };
    apply(true);
  }

  window.addEventListener("resize", function () { if (view) commit(); });

  function zoomAt(px, py, factor) {
    if (!view) return;
    var minW = base.w / MAX_DEPTH, maxW = base.w;
    var p = toWorld(px, py);
    var nw = Math.min(maxW, Math.max(minW, view.w / factor));
    var k = nw / view.w;
    view.x = p.x - (p.x - view.x) * k;
    view.y = p.y - (p.y - view.y) * k;
    view.w = nw; view.h = view.h * k;
    apply();
  }

  function zoomCenter(factor) {
    var rect = stage.getBoundingClientRect();
    zoomAt(rect.width / 2, rect.height / 2, factor);
  }

  document.getElementById("zoom-in").addEventListener("click", function () { zoomCenter(1.5); });
  document.getElementById("zoom-out").addEventListener("click", function () { zoomCenter(1 / 1.5); });
  document.getElementById("fit").addEventListener("click", fit);

  stage.addEventListener("wheel", function (e) {
    e.preventDefault();
    var rect = stage.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  var drag = null;
  stage.addEventListener("pointerdown", function (e) {
    drag = { x: e.clientX, y: e.clientY };
    stage.classList.add("panning");
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drag || !view) return;
    var s = layout(view).s;
    view.x -= (e.clientX - drag.x) / s;
    view.y -= (e.clientY - drag.y) / s;
    drag = { x: e.clientX, y: e.clientY };
    apply();
  });
  stage.addEventListener("pointerup", function () {
    if (drag && view) commit();
    drag = null; stage.classList.remove("panning");
  });
  stage.addEventListener("pointercancel", function () { drag = null; stage.classList.remove("panning"); });
  stage.addEventListener("dblclick", function (e) {
    var rect = stage.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, 2);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "+" || e.key === "=") zoomCenter(1.5);
    else if (e.key === "-" || e.key === "_") zoomCenter(1 / 1.5);
    else if (e.key === "0") fit();
  });

  // --- empire watchtower layer -----------------------------------------------
  // Data: region-N-watchtowers.json from mapgen (empire_node_state +
  // empire_chunk_state). A tower covers whole terrain chunks: 32×32 super-hex
  // cells of the odd-r super lattice, region-local chunk (cx, cz) = super
  // (sx >> 5, sz >> 5). Chunk outlines are drawn exactly (staircase of
  // super-hex edges) when super hexes are big enough to see, else as the
  // equal-area rectangle that tiles seamlessly.

  var CHUNK = 32, CHUNKS_SIDE = 80;
  var WT_EXACT_PX = 3;           // super-hex width (device px) above which outlines are exact
  var watchCanvas = document.getElementById("watch");
  var wtBox = document.getElementById("wt");
  var wtLabel = document.getElementById("wtlabel");
  var wtStatus = document.getElementById("wtstatus");
  var wt = null;                 // parsed layer data
  var wtState = "idle";          // idle | loading | ready | missing
  var wtHover = -1;              // hovered tower index (territory highlight)
  var wtShape = null;            // per-hexSize template {sides:[S,E,N,W], rect:[S,E,N,W]}
  var wtMarkers = [];            // last drawn markers [{cx, cy (canvas units), ref}] for hover
  var MARKER_HOVER_PX = 9;

  // Live tower state: mapgen's JSON only has geometry (positions + covered
  // chunks); energy / upkeep / active stream from empire_node_state on the
  // region's own mirror while the layer is on.
  var LIVE_HOST = "relay.bitcraftsync.app";
  var live = {
    ws: null, state: "off",      // off | connecting | live | reconnecting
    rows: new Map(),             // entity_id (string) → {id, empire, x, z, dim, energy, upkeep, active}
    ready: false,                // InitialSubscription received on this connection
    retry: 0, timer: 0, raf: 0
  };

  function hashHue(id) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return h % 360;
  }

  // entity ids exceed 2^53: read them from the raw row text, not JSON.parse.
  function idField(raw, name, fallback) {
    if (typeof raw === "string") {
      var m = new RegExp('"' + name + '"\\s*:\\s*"?(\\d+)').exec(raw);
      if (m) return m[1];
    }
    return fallback == null ? "" : String(fallback);
  }

  function parseLiveRow(raw) {
    var o = typeof raw === "string" ? JSON.parse(raw) : raw;
    var loc = o.location || {};
    return {
      id: idField(raw, "entity_id", o.entity_id),
      empire: idField(raw, "empire_entity_id", o.empire_entity_id),
      x: loc.x, z: loc.z, dim: loc.dimension,
      energy: o.energy, upkeep: o.upkeep, active: !!o.active
    };
  }

  function ingestLive(tables) {
    (tables || []).forEach(function (t) {
      if (t.table_name && t.table_name !== "empire_node_state") return;
      (t.updates || []).forEach(function (u) {
        (u.deletes || []).forEach(function (r) { live.rows.delete(parseLiveRow(r).id); });
        (u.inserts || []).forEach(function (r) { var o = parseLiveRow(r); live.rows.set(o.id, o); });
      });
    });
  }

  function liveRedraw() {
    if (live.raf) return;
    live.raf = requestAnimationFrame(function () {
      live.raf = 0;
      setWatchStatus();
      if (!drag) drawWatch();
    });
  }

  function startLive() {
    if (live.ws || !wtOn) return;
    clearTimeout(live.timer); live.timer = 0;
    live.state = live.retry ? "reconnecting" : "connecting";
    live.ready = false;
    var url = "wss://" + LIVE_HOST + ":" + (3000 + parseInt(region, 10)) +
              "/v1/database/idc-" + region + "/subscribe?compression=None";
    var ws;
    try { ws = new WebSocket(url, ["v1.json.spacetimedb"]); } catch (e) { scheduleLive(); return; }
    live.ws = ws;
    ws.onmessage = function (ev) {
      if (typeof ev.data !== "string") return;
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.IdentityToken) {
        ws.send(JSON.stringify({ Subscribe: { request_id: 1, query_strings: ["SELECT * FROM empire_node_state;"] } }));
        return;
      }
      var tables = null;
      if (msg.InitialSubscription) {
        live.rows.clear();
        tables = (msg.InitialSubscription.database_update || {}).tables;
        live.ready = true; live.state = "live"; live.retry = 0;
      } else if (msg.SubscribeApplied) {
        live.rows.clear();
        var sa = msg.SubscribeApplied;
        tables = (sa.update || sa.database_update || {}).tables;
        live.ready = true; live.state = "live"; live.retry = 0;
      } else if (msg.TransactionUpdate) {
        var c = (msg.TransactionUpdate.status || {}).Committed;
        tables = c && c.tables;
      } else if (msg.TransactionUpdateLight) {
        tables = (msg.TransactionUpdateLight.update || {}).tables;
      } else if (msg.SubscriptionError) {
        try { ws.close(); } catch (e) { /* ignore */ }
        return;
      }
      if (tables) { ingestLive(tables); liveRedraw(); }
    };
    ws.onclose = function () {
      if (live.ws !== ws) return;          // superseded / stopped on purpose
      live.ws = null;
      scheduleLive();
    };
    liveRedraw();
  }

  function scheduleLive() {
    if (!wtOn) return;
    live.state = "reconnecting";
    live.retry++;
    var delay = Math.min(60000, 2000 * Math.pow(2, live.retry - 1));
    live.timer = setTimeout(startLive, delay);
    liveRedraw();
  }

  function stopLive() {
    clearTimeout(live.timer); live.timer = 0;
    var ws = live.ws;
    live.ws = null; live.state = "off"; live.ready = false; live.retry = 0;
    live.rows.clear();
    if (ws) { try { ws.close(); } catch (e) { /* ignore */ } }
  }

  // Live towers inside this region that the coverage JSON doesn't know yet.
  function liveExtras() {
    if (!live.ready || !wt) return [];
    var o = regionOrigin(region), out = [];
    live.rows.forEach(function (r) {
      if (wt.byId.has(r.id) || r.dim !== 1) return;
      var lx = r.x - o.x, lz = r.z - o.z;
      if (lx < 0 || lz < 0 || lx >= REGION_SIDE || lz >= REGION_SIDE) return;
      out.push({ live: r, x: lx, z: lz, n: Math.round(r.z / 3), e: Math.round(r.x / 3) });
    });
    return out;
  }

  function empireColor(empireId) {
    if (wt.empireIdx.has(empireId)) return wt.colors[wt.empireIdx.get(empireId)];
    return wt.fallback[hashHue(empireId) % wt.fallback.length];
  }

  function empireName(empireId) {
    var i = wt.empireIdx.get(empireId);
    var e = i == null ? null : wt.d.empires[i];
    return (e && e.name) || ("Empire " + empireId);
  }

  function parseWatch(d) {
    var owner = new Int32Array(CHUNKS_SIDE * CHUNKS_SIDE).fill(-1);
    var byTower = d.towers.map(function () { return []; });
    d.chunks.forEach(function (c) {
      if (c[0] < 0 || c[0] >= CHUNKS_SIDE || c[1] < 0 || c[1] >= CHUNKS_SIDE) return;
      owner[c[1] * CHUNKS_SIDE + c[0]] = c[2];
      byTower[c[2]].push(c[1] * CHUNKS_SIDE + c[0]);
    });
    // Empires without an emblem color (NPC) get a hue that never collides
    // with the biome/paving palette (no greens, browns, tans or grays).
    var FALLBACK = ["#29d3f0", "#b46cff", "#ff5a36", "#ff4fa3"];   // "131" (Fallen Empire) → magenta
    var colors = d.empires.map(function (e) {
      return e.color || FALLBACK[hashHue(e.id) % FALLBACK.length];
    });
    var byId = new Map(), empireIdx = new Map();
    d.towers.forEach(function (t, i) { byId.set(t.id, i); });
    d.empires.forEach(function (e, i) { empireIdx.set(e.id, i); });
    return { d: d, owner: owner, byTower: byTower, colors: colors, fallback: FALLBACK,
             byId: byId, empireIdx: empireIdx };
  }

  function ownerAt(cx, cz) {
    if (cx < 0 || cx >= CHUNKS_SIDE || cz < 0 || cz >= CHUNKS_SIDE) return -1;
    return wt.owner[cz * CHUNKS_SIDE + cx];
  }

  // Chunk outline template relative to the center of the chunk's first super
  // hex (sx0, sz0) — every chunk starts on an even super row, so all chunks
  // are translations of one shape. Sides run S (west→east), E (south→north),
  // N (east→west), W (north→south); concatenated they close the polygon.
  function buildShape() {
    var R = proj.size * 3, W = SQRT3 * R;
    function corner(i, j, deg) {
      var t = deg * Math.PI / 180;
      return [W * i + ((j & 1) ? W / 2 : 0) + R * Math.cos(t), -1.5 * R * j + R * Math.sin(t)];
    }
    var S = [], E = [], N = [], Wst = [], i, j;
    for (i = 0; i < CHUNK; i++) S.push(corner(i, 0, 150), corner(i, 0, 90), corner(i, 0, 30));
    for (j = 0; j < CHUNK; j++) E.push(corner(CHUNK - 1, j, 30), corner(CHUNK - 1, j, -30));
    for (i = CHUNK - 1; i >= 0; i--) N.push(corner(i, CHUNK - 1, -30), corner(i, CHUNK - 1, -90), corner(i, CHUNK - 1, 210));
    for (j = CHUNK - 1; j >= 0; j--) Wst.push(corner(0, j, 210), corner(0, j, 150));
    // Equal-area rectangle: zigzag edges averaged (chunks tile it seamlessly).
    var l = -W / 4, r = W * (CHUNK - 1) + 3 * W / 4;
    var b = 0.75 * R, t = -1.5 * R * (CHUNK - 1) - 0.75 * R;
    return {
      size: proj.size,
      sides: [S, E, N, Wst],
      rect: [[[l, b], [r, b]], [[r, b], [r, t]], [[r, t], [l, t]], [[l, t], [l, b]]],
      bbox: { l: l, r: r, b: b, t: t }
    };
  }

  function chunkOrigin(cx, cz) {
    var R = proj.size * 3;
    return [proj.xOff + SQRT3 * R * CHUNK * cx, proj.yOff - 1.5 * R * CHUNK * cz];
  }

  function tileCenter(x, z) {
    var q = x - (z - (z & 1)) / 2;
    return [proj.xOff + proj.size * (SQRT3 * q + SQRT3 / 2 * z), proj.yOff - proj.size * 1.5 * z];
  }

  function drawWatch() {
    var L = committed ? layout(committed) : null;
    var dpr = window.devicePixelRatio || 1;
    var cw = L ? Math.round(L.sw * dpr) : 0, ch = L ? Math.round(L.sh * dpr) : 0;
    if (watchCanvas.width !== cw || watchCanvas.height !== ch) {
      watchCanvas.width = cw; watchCanvas.height = ch;
      if (L) { watchCanvas.style.width = L.sw + "px"; watchCanvas.style.height = L.sh + "px"; }
    }
    var g = watchCanvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cw, ch);
    if (!wtOn || !wt || !L) return;
    if (!wtShape || wtShape.size !== proj.size) wtShape = buildShape();
    var v = committed, k = L.s * dpr;
    var exact = SQRT3 * proj.size * 3 * k >= WT_EXACT_PX;
    var sides = exact ? wtShape.sides : wtShape.rect;
    var bb = wtShape.bbox;
    // visible canvas rect (stage incl. letterbox)
    var x0 = v.x - L.ox / L.s, y0 = v.y - L.oy / L.s;
    var x1 = v.x + (L.sw - L.ox) / L.s, y1 = v.y + (L.sh - L.oy) / L.s;
    function visible(o) {
      return !(o[0] + bb.r < x0 || o[0] + bb.l > x1 || o[1] + bb.b < y0 || o[1] + bb.t > y1);
    }
    function trace(o, side, move) {
      for (var i = 0; i < side.length; i++) {
        var p = side[i];
        if (i === 0 && move) g.moveTo(o[0] + p[0], o[1] + p[1]);
        else g.lineTo(o[0] + p[0], o[1] + p[1]);
      }
    }
    g.setTransform(k, 0, 0, k, (L.ox - v.x * L.s) * dpr, (L.oy - v.y * L.s) * dpr);
    g.lineJoin = "round";

    var towers = wt.d.towers;
    // fills, one path per tower
    for (var t = 0; t < towers.length; t++) {
      var list = wt.byTower[t];
      if (!list.length) continue;
      g.beginPath();
      var any = false;
      for (var n = 0; n < list.length; n++) {
        var cx = list[n] % CHUNKS_SIDE, cz = (list[n] / CHUNKS_SIDE) | 0;
        var o = chunkOrigin(cx, cz);
        if (!visible(o)) continue;
        any = true;
        trace(o, sides[0], true); trace(o, sides[1], false);
        trace(o, sides[2], false); trace(o, sides[3], false);
        g.closePath();
      }
      if (!any) continue;
      g.fillStyle = wt.colors[towers[t].empire];
      g.globalAlpha = t === wtHover ? 0.4 : 0.15;
      g.fill();
    }
    g.globalAlpha = 1;

    // borders: tower ↔ tower thin, empire edge (vs unclaimed / other empire) thick
    var nb = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // S, E, N, W neighbours
    var thin = new Map(), thick = new Map();
    function bucket(m, key) { var a = m.get(key); if (!a) { a = []; m.set(key, a); } return a; }
    for (var cz2 = 0; cz2 < CHUNKS_SIDE; cz2++) {
      for (var cx2 = 0; cx2 < CHUNKS_SIDE; cx2++) {
        var own = ownerAt(cx2, cz2);
        if (own < 0) continue;
        var o2 = chunkOrigin(cx2, cz2);
        if (!visible(o2)) continue;
        var emp = towers[own].empire;
        for (var s = 0; s < 4; s++) {
          var other = ownerAt(cx2 + nb[s][0], cz2 + nb[s][1]);
          if (other === own) continue;
          var sameEmpire = other >= 0 && towers[other].empire === emp;
          bucket(sameEmpire ? thin : thick, emp).push(o2[0], o2[1], s);
        }
      }
    }
    function strokeSides(m, px, alpha) {
      m.forEach(function (arr, emp) {
        g.beginPath();
        for (var i = 0; i < arr.length; i += 3) trace([arr[i], arr[i + 1]], sides[arr[i + 2]], true);
        g.strokeStyle = wt.colors[emp];
        g.globalAlpha = alpha;
        g.lineWidth = px * dpr / k;
        g.stroke();
      });
    }
    strokeSides(thin, 1, 0.7);
    strokeSides(thick, 2.5, 0.95);
    g.globalAlpha = 1;

    // tower markers, constant screen size. Live state: filled = active,
    // dark = inactive, hollow gray = gone from the live table, dashed white
    // ring = built after the coverage JSON (no chunks yet).
    g.setTransform(1, 0, 0, 1, 0, 0);
    var rad = 5.5 * dpr;
    wtMarkers = [];
    function marker(tx, tz, ref, fill, ring, dashed, hot) {
      var c = tileCenter(tx, tz);
      wtMarkers.push({ cx: c[0], cy: c[1], ref: ref });
      var sx = (L.ox + (c[0] - v.x) * L.s) * dpr, sy = (L.oy + (c[1] - v.y) * L.s) * dpr;
      if (sx < -rad * 2 || sy < -rad * 2 || sx > cw + rad * 2 || sy > ch + rad * 2) return;
      g.setLineDash([]);
      g.beginPath();
      g.moveTo(sx, sy - rad * 1.25);
      g.lineTo(sx + rad, sy);
      g.lineTo(sx, sy + rad * 1.25);
      g.lineTo(sx - rad, sy);
      g.closePath();
      if (fill) { g.fillStyle = fill; g.fill(); }
      g.lineWidth = (hot ? 2.5 : 1.5) * dpr;
      g.strokeStyle = hot ? "#ffffff" : ring;
      g.stroke();
      if (dashed) {
        g.beginPath();
        g.arc(sx, sy, rad * 2, 0, Math.PI * 2);
        g.setLineDash([3 * dpr, 3 * dpr]);
        g.lineWidth = 1.5 * dpr;
        g.strokeStyle = "#ffffff";
        g.stroke();
        g.setLineDash([]);
      }
    }
    towers.forEach(function (tw, idx) {
      var hot = wtHover === idx;
      var lr = live.ready ? live.rows.get(tw.id) : null;
      if (live.ready && !lr) { marker(tw.x, tw.z, idx, null, "#9aa4ad", false, hot); return; }
      var active = lr ? lr.active : true;
      marker(tw.x, tw.z, idx, active ? wt.colors[tw.empire] : "#101418", "#101418", false, hot);
    });
    liveExtras().forEach(function (x) {
      var hot = wtHover === "new:" + x.live.id;
      marker(x.x, x.z, "new:" + x.live.id, x.live.active ? empireColor(x.live.empire) : "#101418",
             "#101418", true, hot);
    });
  }

  function fmtAgo(sec) {
    var d = Math.max(0, Date.now() / 1000 - sec);
    if (d < 90) return "just now";
    if (d < 5400) return Math.round(d / 60) + " min ago";
    if (d < 129600) return Math.round(d / 3600) + " h ago";
    return Math.round(d / 86400) + " d ago";
  }

  function setWatchStatus() {
    if (!wtOn) { wtStatus.textContent = ""; return; }
    if (wtState === "loading") { wtStatus.textContent = "loading…"; return; }
    if (wtState === "missing") { wtStatus.textContent = "not available for this region"; return; }
    if (!wt) { wtStatus.textContent = ""; return; }
    var names = wt.d.empires.map(function (e) { return e.name || ("Empire " + e.id); });
    var count, liveTxt;
    if (live.ready) {
      var o = regionOrigin(region);
      count = 0;
      live.rows.forEach(function (r) {
        if (r.dim === 1 && r.x >= o.x && r.z >= o.z && r.x < o.x + REGION_SIDE && r.z < o.z + REGION_SIDE) count++;
      });
      liveTxt = live.state === "live" ? "● live" : "reconnecting…";
    } else {
      count = wt.d.towers.filter(function (t) { return t.inside; }).length;
      liveTxt = live.state === "reconnecting" ? "offline, retrying…" : "connecting…";
    }
    wtStatus.textContent = count + " towers · " + names.join(", ") + " · " + liveTxt;
    wtStatus.title = "Energy, upkeep and active state stream live from the region " + region +
      " mirror.\nCoverage areas from " + new Date(wt.d.fetchedAt * 1000).toLocaleString() +
      " (" + fmtAgo(wt.d.fetchedAt) + ").";
  }

  function loadWatch() {
    if (wtState !== "idle") return;
    wtState = "loading";
    setWatchStatus();
    fetch("region-" + region + "-watchtowers.json", { cache: "no-cache" })
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (d) {
        wt = parseWatch(d); wtState = "ready";
        if (wtOn) startLive();
        setWatchStatus(); drawWatch();
      })
      .catch(function () { wtState = "missing"; setWatchStatus(); });
  }

  function setWatch(on) {
    wtOn = on;
    wtBox.checked = on;
    var p = new URLSearchParams(location.search);
    if (on) p.set("watchtowers", "1"); else p.delete("watchtowers");
    history.replaceState(null, "", "?" + p.toString());
    if (on) { loadWatch(); if (wt) startLive(); } else stopLive();
    setWatchStatus();
    drawWatch();
  }
  wtBox.addEventListener("change", function () { setWatch(wtBox.checked); });

  function liveLine(lr) {
    if (!live.ready) return live.state === "reconnecting" ? "energy: live feed offline" : "energy: connecting…";
    if (!lr) return "not in live data — destroyed since coverage refresh?";
    return "energy " + lr.energy + " · upkeep " + lr.upkeep + (lr.active ? "" : " · inactive");
  }

  // Hover: a marker under the cursor wins, else the tower covering the
  // super cell under it. `p` = canvas point with its px-per-canvas scale.
  function watchInfoAt(superCell, p) {
    if (!wtOn || !wt) return null;
    var hit = -1;
    if (p) {
      var best = MARKER_HOVER_PX / p.s;
      wtMarkers.forEach(function (m) {
        var d = Math.hypot(m.cx - p.x, m.cy - p.y);
        if (d <= best) { best = d; hit = m.ref; }
      });
    }
    if (hit === -1) hit = ownerAt(superCell.x >> 5, superCell.z >> 5);
    if (hit !== wtHover) { wtHover = hit; if (!drag) drawWatch(); }
    if (hit === -1) return null;
    if (typeof hit === "string") {
      var r = live.rows.get(hit.slice(4));
      if (!r) return null;
      return "Watchtower N " + Math.round(r.z / 3) + "  E " + Math.round(r.x / 3) + " · " + empireName(r.empire) +
             "\n" + liveLine(r) + "\nnew — coverage appears after the next map refresh";
    }
    var tw = wt.d.towers[hit], em = wt.d.empires[tw.empire];
    return "Watchtower N " + tw.n + "  E " + tw.e + " · " + (em.name || "Empire " + em.id) +
           "\n" + liveLine(live.rows.get(tw.id)) + " · " + tw.chunks + " chunks";
  }

  // --- mine tier layer ---------------------------------------------------------
  // Mining caves are neutral claims named "<Large >{Ore} Cave"; the ore gives
  // the tier. Markers come from the manifest's claim labels (no extra fetch)
  // and draw at constant screen size above each label, so tiers stay readable
  // long before the label text is. Fills are the T1–T10 paving palette shared
  // with X-Ray / Bitme (game item ladder: gray … white).

  var ORE_TIER = {
    ferralith: 1, pyrelite: 2, emarium: 3, elenvar: 4, luminite: 5,
    rathium: 6, aurumite: 7, celestium: 8, umbracite: 9, astralite: 10
  };
  var TIER_COLORS = [null,
    "#89949a", "#a6816b", "#84937a", "#7a8aa6", "#8e6b81",
    "#966963", "#b0a173", "#769e9e", "#545b62", "#c7dee9"];
  var ROMAN = [null, "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
  var MINE_MIN_PX = 20, MINE_MAX_PX = 34;   // marker side, CSS px (grows with zoom)
  var minesCanvas = document.getElementById("mines");
  var minesBox = document.getElementById("minesbox");
  var minesStatus = document.getElementById("minesstatus");
  var mines = [];                // [{tier, name, x, y (canvas: label anchor), top (plate top)}], tier-ascending
  var mineHits = [];             // last drawn screen boxes for hover, topmost last

  function caveTier(name) {
    var m = /^(?:Large\s+)?(\S+)\s+Cave$/i.exec(String(name || "").trim());
    return m ? (ORE_TIER[m[1].toLowerCase()] || 0) : 0;
  }

  function buildMines() {
    mines = [];
    (man.labels || []).forEach(function (l) {
      var tier = caveTier(l[7]);
      if (tier) mines.push({ tier: tier, name: l[7], x: l[0], y: l[1], top: l[3] });
    });
    // Higher tiers draw last (on top) where markers overlap at low zoom.
    mines.sort(function (a, b) { return a.tier - b.tier; });
  }

  function textColorFor(hex) {
    var n = parseInt(hex.slice(1), 16);
    var lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    return lum > 0.6 ? { fg: "#101418", halo: "rgba(255,255,255,0.35)" } : { fg: "#ffffff", halo: "rgba(16,20,24,0.55)" };
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // Pickaxe in a unit box (0..1): diagonal handle (bottom-left → top-right)
  // under a filled crescent head with pointed tips.
  function pickaxe(g, x, y, s, color) {
    g.save();
    g.translate(x, y); g.scale(s, s);
    g.lineCap = "round";
    g.strokeStyle = color; g.fillStyle = color;
    g.lineWidth = 0.15;
    g.beginPath(); g.moveTo(0.1, 0.92); g.lineTo(0.66, 0.36); g.stroke();      // handle
    g.beginPath();                                                             // head
    g.moveTo(0.04, 0.3);
    g.quadraticCurveTo(0.62, -0.04, 0.72, 0.98);
    g.quadraticCurveTo(0.62, 0.26, 0.04, 0.3);
    g.fill();
    g.restore();
  }

  function drawMines() {
    var L = committed ? layout(committed) : null;
    var dpr = window.devicePixelRatio || 1;
    var cw = L ? Math.round(L.sw * dpr) : 0, ch = L ? Math.round(L.sh * dpr) : 0;
    if (minesCanvas.width !== cw || minesCanvas.height !== ch) {
      minesCanvas.width = cw; minesCanvas.height = ch;
      if (L) { minesCanvas.style.width = L.sw + "px"; minesCanvas.style.height = L.sh + "px"; }
    }
    var g = minesCanvas.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cw, ch);
    mineHits = [];
    if (!minesOn || !L || !mines.length) return;
    var v = committed;
    var depth = base.w / v.w;
    var S = Math.round(Math.min(MINE_MAX_PX, Math.max(MINE_MIN_PX, MINE_MIN_PX + 4 * Math.log2(depth))));
    var gap = 3;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    mines.forEach(function (m) {
      var cx = L.ox + (m.x - v.x) * L.s;
      var plateTop = L.oy + (m.top - v.y) * L.s;
      var anchorY = L.oy + (m.y - v.y) * L.s;
      // Sit just above the label plate; when the label is sub-pixel this is
      // the claim itself.
      var bottom = Math.min(plateTop, anchorY) - gap;
      var x = cx - S / 2, y = bottom - S;
      if (x + S < 0 || y + S < 0 || x > L.sw || y > L.sh) return;
      var fill = TIER_COLORS[m.tier], tc = textColorFor(fill);
      g.shadowColor = "rgba(0,0,0,0.45)"; g.shadowBlur = 4; g.shadowOffsetY = 1;
      roundRect(g, x, y, S, S, S * 0.22);
      g.fillStyle = fill;
      g.fill();
      g.shadowColor = "transparent"; g.shadowBlur = 0; g.shadowOffsetY = 0;
      g.lineWidth = 1.25;
      g.strokeStyle = "#101418";
      g.stroke();
      // icon in the top-left third, numeral in the lower ~60% — no overlap
      pickaxe(g, x + S * 0.08, y + S * 0.07, S * 0.34, tc.fg);
      var label = ROMAN[m.tier];
      var fs = S * 0.52;
      g.font = "700 " + fs + "px DejaVu Sans, Verdana, sans-serif";
      var maxW = S * 0.84, w = g.measureText(label).width;
      if (w > maxW) { fs *= maxW / w; g.font = "700 " + fs + "px DejaVu Sans, Verdana, sans-serif"; }
      g.textAlign = "center"; g.textBaseline = "middle";
      var ty = y + S * 0.66;
      g.lineJoin = "round";
      g.lineWidth = Math.max(1.5, fs / 7);
      g.strokeStyle = tc.halo;
      g.strokeText(label, cx, ty);
      g.fillStyle = tc.fg;
      g.fillText(label, cx, ty);
      mineHits.push({ x: x, y: y, s: S, m: m });
    });
  }

  function setMinesStatus() {
    if (!minesOn) { minesStatus.textContent = ""; return; }
    if (!man) { minesStatus.textContent = ""; return; }
    if (!mines.length) { minesStatus.textContent = "no caves in this region"; return; }
    var counts = [];
    mines.forEach(function (m) { counts[m.tier] = (counts[m.tier] || 0) + 1; });
    var parts = [];
    for (var t = 1; t <= 10; t++) if (counts[t]) parts.push("T" + t + " ×" + counts[t]);
    minesStatus.textContent = mines.length + " caves";
    minesStatus.title = parts.join("\n");
  }

  function setMines(on) {
    minesOn = on;
    minesBox.checked = on;
    var p = new URLSearchParams(location.search);
    if (on) p.set("mines", "1"); else p.delete("mines");
    history.replaceState(null, "", "?" + p.toString());
    setMinesStatus();
    drawMines();
  }
  minesBox.addEventListener("change", function () { setMines(minesBox.checked); });

  // screen point (stage px) → hovered cave, topmost first
  function mineInfoAt(sx, sy) {
    if (!minesOn) return null;
    for (var i = mineHits.length - 1; i >= 0; i--) {
      var h = mineHits[i];
      if (sx >= h.x && sx <= h.x + h.s && sy >= h.y && sy <= h.y + h.s) {
        return "T" + h.m.tier + " mine · " + h.m.name;
      }
    }
    return null;
  }

  // --- coordinate hover popover ---------------------------------------------
  // Inverts mapgen's Projection (pointy-top small hexes, +z north up) from
  // canvas px back to region tile coords, then to world-tile N/E HUD coords —
  // the road planner / in-game map convention (HexGrid.smallToNe:
  // N = round(z/3), E = round(x/3) over WORLD tiles).

  // Region world origin in tiles: BitCraftMap 5×5 grid, id 1 = bottom-left
  // (matches roads-core region_origin; region 14 = (23040, 15360)).
  function regionOrigin(id) {
    var idx = (parseInt(id, 10) || 1) - 1;
    return { x: (idx % 5) * REGION_SIDE, z: Math.floor(idx / 5) * REGION_SIDE };
  }
  var origin = regionOrigin(region);

  // canvas px → nearest odd-r tile (port of mapgen Projection::pixel_to_hex).
  // `scale` 3 inverts onto the super-hex (terrain-cell) lattice instead.
  function pixelToTile(px, py, scale) {
    var sz = proj.size * (scale || 1);
    var wx = (px - proj.xOff) / sz;
    var wy = (py - proj.yOff) / sz;
    var r = -wy / 1.5;
    var q = (wx - SQRT3 / 2 * r) / SQRT3;
    var s = -q - r;
    var rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
    var dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
    if (dq > dr && dq > ds) rq = -rr - rs;
    else if (dr > ds) rr = -rq - rs;
    return { x: rq + (rr - (rr & 1)) / 2, z: rr };   // axial → odd-r offset
  }

  var tip = document.getElementById("coordtip");

  stage.addEventListener("pointermove", function (e) {
    if (!view || !proj || e.pointerType === "touch") return;
    var rect = stage.getBoundingClientRect();
    var p = toWorld(e.clientX - rect.left, e.clientY - rect.top);
    // Gate on the DRAWN super-hex (terrain cell), not the small tile: edge
    // super-hexes overhang the region by a small hex on the south/west (those
    // tiles are real world tiles of the neighbor region), and the last small
    // row/column on the north/east belongs to an undrawn super cell.
    var c = pixelToTile(p.x, p.y, 3);
    var t = pixelToTile(p.x, p.y);
    if (c.x < 0 || c.x >= SUPER_SIDE || c.z < 0 || c.z >= SUPER_SIDE) {
      tip.style.display = "none";
      watchInfoAt({ x: -1, z: -1 });
      return;
    }
    var wx = origin.x + t.x, wz = origin.z + t.z;
    var info = drag ? null : mineInfoAt(e.clientX - rect.left, e.clientY - rect.top);
    var wInfo = watchInfoAt(c, p);
    if (wInfo) info = info ? info + "\n" + wInfo : wInfo;
    tip.textContent = "N " + Math.round(wz / 3) + "  E " + Math.round(wx / 3) +
                      "   (x " + wx + ", z " + wz + ")" + (info ? "\n" + info : "");
    var tx = e.clientX + 14, ty = e.clientY + 18;
    if (tx + tip.offsetWidth > window.innerWidth - 8) tx = e.clientX - tip.offsetWidth - 14;
    if (ty + tip.offsetHeight > window.innerHeight - 8) ty = e.clientY - tip.offsetHeight - 18;
    tip.style.left = tx + "px";
    tip.style.top = ty + "px";
    tip.style.display = "block";
  });
  stage.addEventListener("pointerleave", function () {
    tip.style.display = "none";
    if (wtHover !== -1) { wtHover = -1; drawWatch(); }
  });

  // --- load -----------------------------------------------------------------

  function fail(msg) {
    loading.hidden = false;
    loadingText.hidden = true;
    errorEl.hidden = false;
    errorEl.textContent = msg;
  }

  function fmtMiB(b) { return (b / 1048576).toFixed(1) + " MB"; }

  function load() {
    loadingText.textContent = "Loading region " + region + "…";
    fetch(dir() + "manifest.json", { cache: "no-cache" })
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (m) {
        man = m;
        proj = { size: m.hexSize, xOff: m.xOff, yOff: m.yOff };
        base = { x: 0, y: 0, w: m.width, h: m.height };
        if (m.svg) {
          downloadEl.href = m.svg;
          downloadEl.title = "Download the full vector map (" + fmtMiB(m.svgBytes || 0) + ")";
          downloadEl.hidden = false;
        }
        // Whole-region preview under the tiles: instant first paint, and it
        // backs any tile that has not arrived yet at far-out zooms.
        preview = new Image();
        preview.id = "preview";
        preview.alt = "";
        preview.src = "region-" + region + "-preview.png";
        rasterEl.parentNode.insertBefore(preview, rasterEl);
        buildLabels();
        buildMines();
        fit();
        loading.hidden = true;
        if (wtOn) setWatch(true);
        if (minesOn) setMines(true);
      })
      .catch(function (err) { fail("Could not load region " + region + " tiles — " + err.message); });
  }

  document.title = "Region " + region + " map — relay.bitcraftsync.app";
  load();
})();
</script>
</body>
</html>
